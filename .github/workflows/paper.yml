name: paper

# Horloge de confiance : gèle les candidats demandés, exécute l'étage 2 une seule fois et enregistre les
# décisions quotidiennes des candidats actifs. Aucun LLM. Désactivé tant que PAPER_ENABLED n'est pas « true ».
on:
  schedule:
    - cron: "50 23 * * 1-5"     # après le workflow collector
  workflow_dispatch:

concurrency:
  group: lab-paper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  paper:
    if: ${{ vars.PAPER_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AntoineP07/trading-lab
          token: ${{ secrets.LAB_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_JUDGE_SA_KEY }}
      - name: Gel, étage 2 et décisions
        run: python -m judge.paper
      - name: Enregistrement
        env:
          GH_TOKEN: ${{ secrets.LAB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/AntoineP07/trading-lab.git"
          bash scripts/push.sh "paper : gel et décisions du $(date -u +%F)"
