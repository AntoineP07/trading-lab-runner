name: keepalive

# Crée une activité pour que GitHub ne désactive pas les workflows planifiés (60 jours d'inactivité).
on:
  schedule:
    - cron: "0 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > keepalive.txt
          git config user.name "runner-bot"
          git config user.email "runner-bot@users.noreply.github.com"
          git add keepalive.txt
          git commit -q -m "keepalive $(date -u +%F)"
          git push -q
