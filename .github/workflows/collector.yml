name: collector

# Collecte quotidienne des barres (Alpaca → BigQuery) puis libération des données de plus de 180 jours
# vers le dataset lisible par les agents. Aucun LLM. Les clés Alpaca ne servent qu'ici.
on:
  schedule:
    - cron: "40 22 * * 1-5"     # après la clôture américaine (jours de bourse)
    - cron: "10 3 * * 6"        # samedi : rattrapage crypto et liste d'actifs
  workflow_dispatch:

concurrency:
  group: lab-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: ${{ vars.COLLECTOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AntoineP07/trading-lab
          token: ${{ secrets.LAB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_COLLECTOR_SA_KEY }}
      - name: Liste des actifs (samedi)
        if: github.event.schedule == '10 3 * * 6'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m collector.run assets
      - name: Barres
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m collector.run bars --workers 3
      - name: Libération des données anciennes
        run: python -m collector.run release
      - name: Export du panel pour les agents
        run: python -m collector.run export-panel
