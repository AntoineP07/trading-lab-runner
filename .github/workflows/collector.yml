name: collector

# Collecte quotidienne des barres (Alpaca → BigQuery) puis libération des données de plus de 180 jours
# vers le dataset lisible par les agents. Aucun LLM. Les clés Alpaca ne servent qu'ici.
on:
  schedule:
    - cron: "40 22 * * 1-5"     # après la clôture américaine (jours de bourse)
    - cron: "10 3 * * 6"        # samedi : rattrapage crypto et liste d'actifs
  workflow_dispatch:

concurrency:
  group: lab-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: ${{ vars.COLLECTOR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120      # le premier passage des données complémentaires recharge leur historique
    steps:
      - uses: actions/checkout@v4
        with:
          repository: AntoineP07/trading-lab
          token: ${{ secrets.LAB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_COLLECTOR_SA_KEY }}
      - name: Liste des actifs (samedi)
        if: github.event.schedule == '10 3 * * 6'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m collector.run assets
      - name: Barres
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m collector.run bars --workers 3
      - name: Prix ajustés après splits (rafraîchir puis réparer)
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          python -m collector.run refresh-adjusted
          python -m collector.run repair
      - name: Libération des données anciennes
        run: python -m collector.run release
      - name: Export du panel pour les agents
        run: python -m collector.run export-panel
      - name: Contrôle qualité du panel
        run: python -m collector.run check-panel

      # Données complémentaires (collector/extra.py). Placées après la collecte quotidienne et tolérantes à
      # l'échec, pour qu'un défaut ici ne bloque jamais les barres ; la dernière étape rend l'échec visible.
      # Chaque commande reprend là où elle s'est arrêtée (le premier passage recharge l'historique).
      - name: Actions sur titres (splits, dividendes, fusions)
        id: x_corporate
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m collector.run corporate-actions
      - name: Photo des actifs (statut d'emprunt du jour)
        id: x_assets
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m collector.run assets-snapshot
      - name: Barres minute hors séance
        id: x_minute
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: python -m collector.run minute-bars
      - name: Transactions d'initiés (jeux trimestriels de la SEC)
        id: x_insiders
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m collector.run insiders
      - name: Libération des données complémentaires
        id: x_release
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m collector.run release-extra
      - name: Échec d'une collecte complémentaire
        if: ${{ steps.x_corporate.outcome == 'failure' || steps.x_assets.outcome == 'failure' || steps.x_minute.outcome == 'failure' || steps.x_insiders.outcome == 'failure' || steps.x_release.outcome == 'failure' }}
        run: |
          echo "Une collecte complémentaire a échoué : voir les étapes précédentes. Les barres quotidiennes ne sont pas concernées."
          exit 1
